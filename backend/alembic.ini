# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# timezone = 

# max length of characters to apply to the
# "slug" field
# max_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow begin_transaction() to be called in the
# env.py file (in some cases this is required for DDL)
# connectless_operation = false

# set to 'true' if you want to generate migrations for a specific database schema
# include_schemas = false

# set to 'true' if you want to use the 'autogenerate' feature of Alembic
enable_autogenerate = true

# set to 'true' to include the DDL related to constraints, indexes, etc. in the migration script
# include_object = false

# set to 'true' to automatically generate a unique revision ID for each migration script
# version_table_pk = true

# set to 'true' if you want to use the default naming convention for constraints, indexes, etc.
use_naming_convention = true

# set to 'true' to avoid generating migration scripts that only add comments or whitespace
# ignore_dialect_options = false

# set the URL to your database here - will be overridden by environment settings
sqlalchemy.url = postgresql://user:password@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# after a new revision file is written.
#
# The script/function must accept a single argument (the revision context),
# and should return a None value to indicate success.
#
# scripts are run in this order:
#   - pre_write_hooks (if any)
#   - post_write_hooks (if any)
#
# Example: generate a version table during alembic init
# hooks = version_table

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARNING" logs neither.  (Recommended for production)

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S