[tool:pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose
asyncio_mode = auto
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    security: marks tests as security tests

[coverage:run]
source = app
omit = 
    */venv/*
    */migrations/*
    */tests/*
    */__pycache__/*
    */alembic/*

